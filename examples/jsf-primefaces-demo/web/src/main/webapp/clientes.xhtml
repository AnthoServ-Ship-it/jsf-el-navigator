<!DOCTYPE html>
<html
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:p="http://primefaces.org/ui"
>
    <h:head>
        <title>Demo JSF EL Navigator</title>
    </h:head>
    <h:body>
        <h:form id="formulario">
            <p:inputText value="#{clienteController.nombre}" />
            <p:commandButton
                value="Guardar"
                actionListener="#{clienteController.guardar()}"
                update="mensajes"
            />
            <p:messages id="mensajes" />
        </h:form>
    </h:body>
</html>
